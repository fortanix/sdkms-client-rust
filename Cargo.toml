[package]
name = "sdkms"
version = "0.6.0"
authors = ["Fortanix, Inc."]
license = "MPL-2.0"
description = """
API bindings for Fortanix DSM (a.k.a. Fortanix SDKMS)
"""
readme = "README.md"
repository = "https://github.com/fortanix/sdkms-client-rust"
documentation = "https://docs.rs/sdkms"
homepage = "https://fortanix.com/products/sdkms/"
categories = ["api-bindings"]
edition = "2018"

[features]
default = ["native-tls"]
native-tls = ["dep:simple-hyper-client-native-tls", "dep:tokio-native-tls"]
rustls = ["dep:simple-hyper-client-rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
base64 = "0.13"
bitflags = "1.0"
headers = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple-hyper-client-native-tls = { version = "0.2.1", optional = true }
simple-hyper-client-rustls = { version = "0.2.1", optional = true }
simple-hyper-client = "0.4.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio-native-tls = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", optional = true }
webpki-roots = { version = "1.0.11", optional = true }
uuid = { version = "1.0", features = ["serde", "v4"] }
cfg-if = "1.0.5"

[dev-dependencies]
env_logger = "0.6"
rand = "0.6"
